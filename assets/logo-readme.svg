<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" fill="none">
  <defs>
    <!-- Background Card Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#212035"/>
      <stop offset="40%" stop-color="#181726"/>
      <stop offset="100%" stop-color="#11101C"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="150" cy="110" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#CDB4FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#181726" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowRight" cx="840" cy="190" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5A9C9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#11101C" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Rim Stroke -->
    <linearGradient id="cardRim" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#A6C8FF" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#45455E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Emblem Gradients -->
    <linearGradient id="badgeBg" x1="45" y1="45" x2="215" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2942"/>
      <stop offset="100%" stop-color="#191828"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="45" y1="45" x2="215" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#CDB4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#45455E" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="65" y1="75" x2="195" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#89DCEB"/>
      <stop offset="30%" stop-color="#A6C8FF"/>
      <stop offset="70%" stop-color="#CDB4FF"/>
      <stop offset="100%" stop-color="#F5A9C9"/>
    </linearGradient>
    <linearGradient id="islandGrad" x1="95" y1="115" x2="170" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CDB4FF"/>
      <stop offset="50%" stop-color="#A6C8FF"/>
      <stop offset="100%" stop-color="#89DCEB"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="titleGrad" x1="300" y1="70" x2="520" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E1EE"/>
    </linearGradient>

    <filter id="ambientBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
    </filter>
  </defs>

  <!-- ── CARD BACKGROUND ── -->
  <rect x="2" y="2" width="956" height="256" rx="28" fill="url(#cardBg)"/>
  <rect x="2" y="2" width="956" height="256" rx="28" fill="url(#cardGlow)"/>
  <rect x="2" y="2" width="956" height="256" rx="28" fill="url(#cardGlowRight)"/>
  <rect x="2" y="2" width="956" height="256" rx="28" fill="none" stroke="url(#cardRim)" stroke-width="1.5"/>

  <!-- Top Glass Highlight Line -->
  <path d="M32 3 H 928" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- ── LEFT EMBLEM BADGE ── -->
  <g transform="translate(8, 0)">
    <!-- Emblem Container Squircle -->
    <rect x="44" y="46" width="168" height="168" rx="44" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.5"/>
    <path d="M64 48 Q 128 45 192 48" stroke="rgba(255,255,255,0.32)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Ambient Glow behind Glyph -->
    <g opacity="0.45" filter="url(#ambientBlur)">
      <path d="M174 92 H108 C96 92 86 102 86 114 V146 C86 158 96 168 108 168 H174"
            stroke="url(#ribbonGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="104" y="119" width="58" height="18" rx="9" fill="url(#islandGrad)"/>
    </g>

    <!-- The Elaren 'E' Glyph -->
    <path d="M172 92 H108 C96.4 92 87 101.4 87 113 V147 C87 158.6 96.4 168 108 168 H172"
          stroke="url(#ribbonGrad)"
          stroke-width="17"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Glass Sheen on Top Bar of the Glyph -->
    <path d="M110 85 H166" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Floating Dynamic Island (Middle Bar) -->
    <rect x="104" y="121" width="56" height="18" rx="9" fill="url(#islandGrad)"/>
    <rect x="104" y="121" width="56" height="18" rx="9" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

    <!-- Island Core / Avatar Sensor -->
    <circle cx="147" cy="130" r="4" fill="#FFFFFF"/>
    <circle cx="147" cy="130" r="2" fill="#181726"/>
  </g>

  <!-- ── VERTICAL DIVIDER ── -->
  <line x1="256" y1="58" x2="256" y2="202" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── RIGHT CONTENT (TYPOGRAPHY & BADGES) ── -->
  <g transform="translate(290, 0)">
    <!-- Logotype -->
    <text x="0" y="116" fill="url(#titleGrad)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="750" letter-spacing="-1.8">Elaren</text>

    <!-- Shell Accent Pulse Dot -->
    <circle cx="222" cy="82" r="5" fill="#A6C8FF"/>
    <circle cx="222" cy="82" r="2.5" fill="#FFFFFF"/>

    <!-- Subtitle / Architecture Descriptor -->
    <text x="3" y="150" fill="#A9A4BB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="4">SHELL DE ESCRITORIO PARA KDE PLASMA 6</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(3, 172)">
      <!-- Badge 1: Wayland -->
      <g transform="translate(0, 0)">
        <rect width="86" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <circle cx="14" cy="13" r="3" fill="#89DCEB"/>
        <text x="24" y="17" fill="#E6E1E5" font-family="Inter, sans-serif" font-size="11" font-weight="550">Wayland</text>
      </g>

      <!-- Badge 2: Quickshell -->
      <g transform="translate(96, 0)">
        <rect width="138" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <circle cx="14" cy="13" r="3" fill="#A6C8FF"/>
        <text x="24" y="17" fill="#E6E1E5" font-family="Inter, sans-serif" font-size="11" font-weight="550">Quickshell &amp; QML</text>
      </g>

      <!-- Badge 3: Dynamic Island -->
      <g transform="translate(244, 0)">
        <rect width="126" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <circle cx="14" cy="13" r="3" fill="#CDB4FF"/>
        <text x="24" y="17" fill="#E6E1E5" font-family="Inter, sans-serif" font-size="11" font-weight="550">Dynamic Island</text>
      </g>

      <!-- Badge 4: Glassmorphic UI -->
      <g transform="translate(380, 0)">
        <rect width="128" height="26" rx="13" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <circle cx="14" cy="13" r="3" fill="#F5A9C9"/>
        <text x="24" y="17" fill="#E6E1E5" font-family="Inter, sans-serif" font-size="11" font-weight="550">Glassmorphic UI</text>
      </g>
    </g>
  </g>
</svg>