<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242338"/>
      <stop offset="50%" stop-color="#181827"/>
      <stop offset="100%" stop-color="#11101B"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="256" cy="130" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#CDB4FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#181827" stop-opacity="0"/>
    </radialGradient>

    <!-- Squircle Rim Light Border -->
    <linearGradient id="rimBorder" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#A6C8FF" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#45455E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#282839" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Outer 'E' Ribbon Gradient (Wayland / Plasma Aurora) -->
    <linearGradient id="ribbonGrad" x1="130" y1="130" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#89DCEB"/>
      <stop offset="25%" stop-color="#A6C8FF"/>
      <stop offset="70%" stop-color="#CDB4FF"/>
      <stop offset="100%" stop-color="#F5A9C9"/>
    </linearGradient>

    <!-- Dynamic Island Core Gradient -->
    <linearGradient id="islandGrad" x1="188" y1="233" x2="336" y2="279" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CDB4FF"/>
      <stop offset="50%" stop-color="#A6C8FF"/>
      <stop offset="100%" stop-color="#89DCEB"/>
    </linearGradient>

    <!-- Avatar Pulse Core Gradient -->
    <linearGradient id="pulseGrad" x1="290" y1="244" x2="318" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CDB4FF"/>
    </linearGradient>

    <!-- Soft Ambient Drop Shadow & Glow Filters -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glyphGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
    </filter>
  </defs>

  <!-- ── BASE SQUIRCLE (App Launcher Standard) ── -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#squircleShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGlow)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="url(#rimBorder)" stroke-width="2"/>

  <!-- Top Glass Highlight Specular Arc -->
  <path d="M84 38 Q 256 34 428 38" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- ── AMBIENT GLOW LAYER ── -->
  <g opacity="0.4" filter="url(#glyphGlow)">
    <path d="M368 166 H200 C169.07 166 144 191.07 144 222 V290 C144 320.93 169.07 346 200 346 H368"
          stroke="url(#ribbonGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="188" y="233" width="148" height="46" rx="23" fill="url(#islandGrad)"/>
  </g>

  <!-- ── MAIN GLYPH: THE ELAREN 'E' (SHELL + DYNAMIC ISLAND) ── -->

  <!-- Outer Shell Arc: Status Bar + Spine + Base Horizon -->
  <path d="M368 166 H200 C169.07 166 144 191.07 144 222 V290 C144 320.93 169.07 346 200 346 H368"
        stroke="url(#ribbonGrad)"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Glass Sheen on Top Status Bar -->
  <path d="M204 148 H356" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Floating Dynamic Island Capsule (Expanding Center Core) -->
  <rect x="188" y="233" width="148" height="46" rx="23" fill="url(#islandGrad)"/>

  <!-- Dynamic Island Glass Highlights -->
  <rect x="188" y="233" width="148" height="46" rx="23" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <path d="M208 237 H314" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- The Island Heart / Avatar Sensor Core -->
  <circle cx="298" cy="256" r="10" fill="url(#pulseGrad)"/>
  <circle cx="298" cy="256" r="5" fill="#181827" opacity="0.9"/>
  <circle cx="298" cy="256" r="2.2" fill="#FFFFFF"/>

  <!-- Subtle Shell Zone Accent Dots on Left Spine -->
  <circle cx="144" cy="256" r="3.5" fill="#FFFFFF" opacity="0.35"/>
</svg>